<svg width="512" height="160" viewBox="0 0 512 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blueGradient" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#00BFFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Logo Icon -->
    <g transform="translate(80, 80) scale(0.4)">
        <path d="M0 -160 L138.56 -80 L138.56 80 L0 160 L-138.56 80 L-138.56 -80 Z" 
              fill="none" stroke="url(#blueGradient)" stroke-width="12" filter="url(#glow)" />
        <path d="M-70 -40 Q-30 -80 0 -40 Q30 0 70 -40" 
              fill="none" stroke="url(#goldGradient)" stroke-width="15" stroke-linecap="round" filter="url(#glow)" />
        <path d="M-70 40 Q-30 80 0 40 Q30 0 70 40" 
              fill="none" stroke="url(#goldGradient)" stroke-width="15" stroke-linecap="round" filter="url(#glow)" />
        <circle cx="0" cy="0" r="30" fill="url(#blueGradient)" filter="url(#glow)" />
    </g>

    <!-- Main Text -->
    <text x="160" y="85" font-family="Arial Black, sans-serif" font-weight="900" font-size="64" fill="white" filter="url(#shadow)" letter-spacing="-2">AIP<tspan fill="url(#goldGradient)">CORE</tspan></text>
    <text x="162" y="125" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="url(#goldGradient)" letter-spacing="6" opacity="0.8">AUTONOMOUS REWARD PROTOCOL</text>
</svg>
